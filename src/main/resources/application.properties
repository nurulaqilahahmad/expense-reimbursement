spring.application.name=expense-reimbursement

spring.datasource.url=jdbc:postgresql://localhost:5432/expense_reimbursement
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/expense-reimbursement

